spring.application.name=sgdts

# ===== Supabase / PostgreSQL DataSource =====
# When using Supabase:
# 1. Direct (Port 5432): jdbc:postgresql://db.[PROJECT-REF].supabase.co:5432/postgres?sslmode=require
# 2. Pooler (Port 6543): jdbc:postgresql://[REGION].pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sgdts}
spring.datasource.username=${DB_USERNAME:sgdts}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== HikariCP Connection Pool (Optimized for Supabase) =====
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
# Disable server-side prepared statements for Supabase/PgBouncer transaction pooler (Port 6543)
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0

# ===== JPA / Hibernate =====
# Set to 'update' so Hibernate automatically creates/updates all tables in Supabase on startup
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway =====
# Disabled by default so empty migration directories don't cause startup failure
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics
