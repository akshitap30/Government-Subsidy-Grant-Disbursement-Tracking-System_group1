spring.application.name=sgdts

# ===== DataSource (override in application-local.properties or env vars) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sgdts}
spring.datasource.username=${DB_USERNAME:sgdts}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics

