# ===== Test configuration — overrides main application.properties =====
spring.application.name=sgdts-test

# In-memory H2 database for tests (no PostgreSQL required)
spring.datasource.url=jdbc:h2:mem:sgdts_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema from entities in tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway in tests — schema is managed by Hibernate
spring.flyway.enabled=false

# Disable OAuth2 auto-configuration that requires live client registration
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientWebSecurityAutoConfiguration

# Disable mail auto-configuration in tests
spring.mail.host=localhost
spring.mail.port=3025
